<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="logoFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="logoShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Rounded background -->
  <rect width="120" height="120" rx="28" fill="url(#logoBg)" filter="url(#logoShadow)"/>
  <!-- Folder shape -->
  <path d="M22 34 L48 34 L55 41 L96 41 L96 88 L22 88 Z" fill="url(#logoFold)" opacity="0.9"/>
  <!-- Folder tab highlight -->
  <path d="M22 34 L48 34 L55 41 L22 41 Z" fill="#c4b5fd" opacity="0.6"/>
  <!-- Inner content area -->
  <rect x="28" y="46" width="62" height="36" rx="4" fill="white" opacity="0.15"/>
  <!-- Markdown "M" letter -->
  <text x="59" y="73" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle">M</text>
  <!-- Explorer dots (file tree lines) -->
  <circle cx="30" cy="48" r="2" fill="#e0e7ff" opacity="0.8"/>
  <circle cx="36" cy="48" r="2" fill="#e0e7ff" opacity="0.6"/>
  <circle cx="42" cy="48" r="2" fill="#e0e7ff" opacity="0.4"/>
  <!-- Tree branch lines -->
  <line x1="32" y1="52" x2="32" y2="58" stroke="#e0e7ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="32" y1="58" x2="38" y2="58" stroke="#e0e7ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="32" y1="58" x2="32" y2="64" stroke="#e0e7ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="32" y1="64" x2="40" y2="64" stroke="#e0e7ff" stroke-width="1.5" opacity="0.3"/>
</svg>
